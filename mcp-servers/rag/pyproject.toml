[project]
name = "8rack-rag-server"
version = "0.1.0"
description = "8Rack's knowledge base as an MCP server: indexes a workspace and searches it, embedding through local Ollama."
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "anyio>=4.10",
  "uvicorn>=0.31.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
8rack-rag-server = "rag_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rag_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
